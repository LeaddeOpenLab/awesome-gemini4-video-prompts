name: Deploy prompt collection to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "collection/**"
      - "data/**"
      - "site/**"
      - "prompts/**"
      - "covers/**"
      - ".github/scripts/organize-files.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Organize incoming files
        run: python3 .github/scripts/organize-files.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static pages
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: python3 collection/site/build.py
      - name: Check pages and local links
        run: python3 collection/site/check.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: collection/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
