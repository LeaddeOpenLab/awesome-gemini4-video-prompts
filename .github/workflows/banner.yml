name: Organize files and refresh README
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-banner
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Render banner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/organize-files.py
          python3 .github/scripts/update-banner.py
          python3 .github/scripts/update-readme.py
      - name: Save banner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Organize files and refresh README [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
