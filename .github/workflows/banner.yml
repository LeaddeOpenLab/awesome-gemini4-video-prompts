name: Refresh README and banner
on:
  push:
    branches: [main]
    paths:
      - data/**
      - .github/scripts/update-banner.py
      - .github/scripts/update-readme.py
      - site/catalog.py
      - .github/workflows/banner.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-banner
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Render banner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/update-banner.py
          python3 .github/scripts/update-readme.py
      - name: Save banner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md data/banner.svg data/categories
          if ! git diff --cached --quiet; then
            git commit -m "Refresh README and banner [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
